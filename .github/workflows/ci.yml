name: CI Quality Gate & Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install flake8 black coverage pip-audit

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS/TS Dependencies
        run: yarn install --frozen-lockfile

      - name: Dependency Security Audit
        run: pip-audit -r requirements-lock.txt

      - name: Run Python Linting
        run: |
          flake8 --extend-ignore=E203 webapp tests
          black --check --line-length 79 webapp tests

      - name: Run SCSS Linting
        run: yarn lint-scss

      - name: Run HTML Linting
        run: yarn lint-html

      - name: Run LLMS Linting
        run: yarn lint-llms

      - name: Run Test Suite with Coverage
        run: |
          coverage run -m unittest discover tests
          coverage report --fail-under=60

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
